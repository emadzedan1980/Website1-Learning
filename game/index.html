<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Math Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>JavaScript Math Game</h1>
    <section class="main-ui">
      <h2 class="question"></h2>
      <form action="" class="form">
        <input id="inputText" type="text" autocomplete="off" />
        <button>Submit Answer</button>
      </form>
      <p>
        You Need <span class="points-needed">10</span> more points, and are
        allowed to make <span class="mistakes-allowed">2</span> more mistakes.
      </p>
      <div class="progress">
        <div class="boxes">
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
          <div class="box"></div>
        </div>
        <div class="progress-inner"></div>
      </div>
    </section>

    <div class="overlay">
      <div class="overlay-inner">
        <p class="end-message"></p>
        <button class="reset-button">Start Over</button>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
